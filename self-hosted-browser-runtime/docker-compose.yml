services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: ${APP_URL:-http://localhost:18080}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BROWSER_WORKER_URL: http://browser-worker:8081
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - browser-runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  browser-worker:
    build:
      context: .
      dockerfile: browser-worker/Dockerfile
    init: true
    environment:
      PORT: 8081
      CHROMIUM_EXECUTABLE: ${CHROMIUM_EXECUTABLE:-/usr/bin/chromium}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WORKER_PORT:-18081}:8081"
    networks:
      - browser-runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  browser-runtime:
    driver: bridge
