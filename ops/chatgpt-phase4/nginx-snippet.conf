# ChatGPT Phase 4 additions inside the dedicated HTTPS server location.
# Global http-context map (e.g. /etc/nginx/conf.d/chatgpt-upgrade-map.conf):
map $http_upgrade $chatgpt_connection_upgrade {
    default upgrade;
    '' close;
}

# Inside chatgpt.topratedseotools.com location /:
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $chatgpt_connection_upgrade;
