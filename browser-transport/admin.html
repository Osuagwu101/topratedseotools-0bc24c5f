<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuillBot writer controls | TopRated SEO Tools</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f5;color:#173523;font:15px/1.5 system-ui}main{max-width:1040px;margin:48px auto;padding:0 24px}h1{margin:0;font-size:30px}p{color:#54715e}.card{background:white;border:1px solid #d9e7dd;border-radius:16px;padding:24px;margin:22px 0;box-shadow:0 6px 24px #17352308}input,button{font:inherit;padding:10px 14px;border:1px solid #bfd2c4;border-radius:8px}button{background:#175f34;color:white;cursor:pointer}button.secondary{background:#fff;color:#175f34}button:disabled{opacity:.5;cursor:wait}form{display:flex;gap:12px;flex-wrap:wrap}form input{flex:1;min-width:180px}#status{min-height:24px;color:#175f34}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e5eee8}td small{display:block;color:#64786a}input[type=number]{width:100px}.tools{display:flex;gap:8px;align-items:center}.scroll{overflow:auto}a{color:#175f34}#controls{display:none}#search{width:100%;margin-bottom:12px}.badge{font-size:12px;border-radius:12px;background:#e5f4e9;padding:4px 9px}
</style></head><body><main><a href="https://topratedseotools.com/admin">? TopRated Admin</a><h1>QuillBot writer controls</h1><p>Set daily allowances and manage writer access. Allowances reset at midnight in Nigeria.</p>
<section id="login-card" class="card"><h2>Admin sign-in</h2><form id="login"><input name="email" type="email" placeholder="Admin email" autocomplete="username" required><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Sign in</button></form></section>
<p id="status" role="status"></p><section id="controls" class="card"><div class="tools"><h2 style="flex:1">Writers</h2><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Sign out</button></div><input id="search" placeholder="Search by name or email"><div class="scroll"><table><thead><tr><th>Writer</th><th>Today</th><th>Daily allowance</th><th>Access</th></tr></thead><tbody id="writers"></tbody></table></div></section>
</main><script>
let token='',writers=[];const base='/__qbtest/__trst',status=document.querySelector('#status');
async function api(path,method='GET',body){const r=await fetch(base+path,{method,cache:'no-store',headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const text=await r.text();if(!r.ok)throw Error(text||'Request failed');return text?JSON.parse(text):{};}
function render(){const q=document.querySelector('#search').value.toLowerCase(),tbody=document.querySelector('#writers');tbody.replaceChildren();for(const writer of writers.filter(w=>(w.full_name+' '+w.email).toLowerCase().includes(q))){const row=document.createElement('tr'),person=document.createElement('td'),name=document.createElement('strong'),email=document.createElement('small');name.textContent=writer.full_name||'Writer';email.textContent=writer.email||'';person.append(name,email);const used=document.createElement('td');used.textContent=writer.used+' used';const quota=document.createElement('td'),wrap=document.createElement('div'),input=document.createElement('input'),save=document.createElement('button');wrap.className='tools';input.type='number';input.min='0';input.max='10000';input.value=writer.daily_limit;input.setAttribute('aria-label','Daily allowance for '+name.textContent);save.textContent='Save';save.onclick=async()=>{save.disabled=true;try{const result=await api('/admin/limits','POST',{user_id:writer.user_id,daily_limit:Number(input.value)});writer.daily_limit=result.daily_limit;status.textContent='Daily allowance updated.';}catch(e){status.textContent=e.message;}finally{save.disabled=false}};wrap.append(input,save);quota.append(wrap);const access=document.createElement('td'),toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=writer.status==='active'?'Suspend access':'Restore access';toggle.onclick=async()=>{toggle.disabled=true;try{await api('/admin/control','POST',{user_id:writer.user_id,status:writer.status==='active'?'suspended':'active'});await load();status.textContent='Writer access updated.';}catch(e){status.textContent=e.message;toggle.disabled=false}};access.append(toggle);row.append(person,used,quota,access);tbody.append(row);}if(!tbody.children.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=4;cell.textContent='No matching writers with assigned QuillBot access.';row.append(cell);tbody.append(row);}}
async function load(){const data=await api('/admin/writers');writers=data.writers;render();}
document.querySelector('#login').onsubmit=async event=>{event.preventDefault();const f=event.target,b=f.querySelector('button');b.disabled=true;status.textContent='Checking Admin access...';try{const data=new FormData(f),r=await fetch(base+'/app-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:data.get('email'),password:data.get('password')})});f.elements.password.value='';if(!r.ok)throw Error(await r.text());token=(await r.json()).access_token;await load();document.querySelector('#login-card').style.display='none';document.querySelector('#controls').style.display='block';status.textContent='';}catch(e){token='';status.textContent=e.message;}finally{b.disabled=false}};
document.querySelector('#search').oninput=render;document.querySelector('#refresh').onclick=()=>load().catch(e=>status.textContent=e.message);document.querySelector('#logout').onclick=()=>{token='';writers=[];location.reload()};
</script></body></html>
