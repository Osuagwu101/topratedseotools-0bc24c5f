name: Phrasly Admin usage limits
on:
  push:
    paths:
      - 'src/lib/phrasly-extension/**'
      - 'src/components/tools/Phrasly*'
      - 'supabase/migrations/*phrasly_user_usage_limits.sql'
      - 'tests/phrasly-limits-backend.cjs'
      - 'tests/phrasly-entitlements/**'
      - 'tests/phrasly-admin-exporter/limits-browser.cjs'
      - '.github/workflows/phrasly-limits.yml'
  pull_request:
    paths:
      - 'src/lib/phrasly-extension/**'
      - 'src/components/tools/Phrasly*'
      - 'supabase/migrations/*phrasly_user_usage_limits.sql'
      - 'tests/phrasly-limits-backend.cjs'
      - 'tests/phrasly-entitlements/**'
      - 'tests/phrasly-admin-exporter/limits-browser.cjs'
      - '.github/workflows/phrasly-limits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  limits-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node --experimental-vm-modules tests/phrasly-limits-backend.cjs
      - run: npm ci --prefix tests/phrasly-entitlements --ignore-scripts --no-audit --no-fund
      - run: node tests/phrasly-entitlements/limits.mjs
      - run: node scripts/phrasly/build-staff-workspace.mjs
      - run: npm ci --prefix tests/phrasly-admin-exporter --ignore-scripts --no-audit --no-fund
      - run: ./tests/phrasly-admin-exporter/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/phrasly-admin-exporter/limits-browser.cjs
