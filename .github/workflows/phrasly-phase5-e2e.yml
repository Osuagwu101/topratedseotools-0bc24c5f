name: Phrasly Phase 5 cross-service regression
on:
  push:
    branches: [phrasly/phase5-e2e-20261026]
  pull_request:
    paths: ['tests/**', '.github/workflows/phrasly-phase5-e2e.yml', 'src/lib/phrasly-extension/**', 'src/components/tools/**']
jobs:
  isolated-regressions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_phase5_dummy
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_phase5_dummy
      VITE_SUPABASE_URL: http://127.0.0.1:9
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_phase5_dummy
      VITE_SUPABASE_PROJECT_ID: phase5-offline
      PHRASLY_EXTENSION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Frozen dependencies
        run: bun install --frozen-lockfile
      - name: Phrasly protocol and server contract regressions
        run: bun test tests/phrasly-extension-protocol.test.ts tests/phrasly-extension-launcher.test.ts tests/phrasly-phase3-backend.test.ts
      - name: Unrelated product regression checks
        run: |
          bun test tests/stealthwriter-customer-assignment.test.ts tests/stealthwriter-provider-routing.test.ts tests/chatgpt-phase4-validation.test.ts tests/turnitin-credit-foundation.test.ts tests/turnitin-phase5-billing.test.ts tests/currency-payments.test.ts tests/custom-payment-e2e.test.ts tests/offline-payments.test.ts tests/stealthwriter-session-vault.test.ts tests/chatgpt-session-vault.test.ts
      - name: Phrasly worker and session failures
        run: |
          bun test tests/phrasly-session-vault.test.ts tests/phrasly-proxy-foundation.test.ts
          node --test tests/phrasly-extension-worker.test.cjs
      - name: Verify AWS popup bridge is connected before handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('src/lib/phrasly-extension/launch-from-website.ts').read_text()
          assert source.index('fetch("/ext-session"') < source.index('fetch("/ext-handoff.php?"'), 'popup session must be created before signed handoff'
          assert 'credentials:"same-origin"' in source
          print('PHRASLY_AWS_POPUP_SESSION_BRIDGE_PASS')
          PY
      - name: Full website build
        run: bun run build
      - name: Explicit no-production-activation gate
        run: |
          grep -q 'enabled: false' extensions/phrasly-oneclick/config.js
          test -s .output/server/index.mjs
