name: Phase 2 StealthWriter Audit

on:
  push:
    branches: [phase2-stealthwriter-admin-session]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Phase 2 session-vault regression tests
        run: bun tests/stealthwriter-session-vault.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
