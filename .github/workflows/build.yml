name: Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: SneakWrite SSO regression test
        run: bun tests/direct-sso-url.test.ts
      - name: Phrasly shared-auth regression tests
        run: bun tests/phrasly-auth-state.test.ts
      - name: Phrasly branded viewer regression tests
        run: bun tests/browser-viewer.test.ts
      - name: Custom Payment gateway regression tests
        run: bunx vitest run tests/custom-payment-merchant-currencies.test.ts tests/custom-payment-gateways.test.ts tests/flutterwave-gateway.test.ts tests/flutterwave-provider-validation.test.ts tests/gateway-routing-and-custom-tools.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
