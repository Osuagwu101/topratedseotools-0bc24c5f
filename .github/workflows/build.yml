name: Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: SneakWrite SSO regression test
        run: bun tests/direct-sso-url.test.ts
      - name: Phrasly proxy foundation regression tests
        run: bun tests/phrasly-proxy-foundation.test.ts
      - name: Phrasly Phase 2 session-vault tests
        run: bun tests/phrasly-session-vault.test.ts
      - name: Phrasly Phase 3 proxy tests
        run: bun tests/phrasly-proxy.test.ts

      - name: ChatGPT Phase 2 session-vault tests
        run: bun tests/chatgpt-session-vault.test.ts
      - name: ChatGPT Phase 2 foundation checks
        run: bun tests/chatgpt-phase2-foundation.test.ts

      - name: StealthWriter Phase 2 session-vault tests
        run: bun tests/stealthwriter-session-vault.test.ts
      - name: StealthWriter Phase 3 proxy tests
        run: bun tests/stealthwriter-proxy.test.ts
      - name: StealthWriter Phase 4 validation matrix
        run: bun tests/stealthwriter-phase4-validation.test.ts
      - name: StealthWriter Phase 4 source conformance
        run: bun tests/stealthwriter-phase4-source-conformance.test.ts
      - name: StealthWriter Phase 5.1 AWS parity
        run: bun tests/stealthwriter-phase5-aws-parity.test.ts
      - name: StealthWriter multi-account foundation
        run: bun tests/stealthwriter-multi-account-foundation.test.ts
      - name: StealthWriter multi-account admin
        run: bun tests/stealthwriter-multi-account-admin.test.ts
      - name: StealthWriter customer account assignment
        run: bun tests/stealthwriter-customer-assignment.test.ts
      - name: StealthWriter provider-aware routing
        run: bun tests/stealthwriter-provider-routing.test.ts

      - name: Custom Payment gateway regression tests
        run: bunx vitest run tests/custom-payment-merchant-currencies.test.ts tests/custom-payment-gateways.test.ts tests/flutterwave-gateway.test.ts tests/flutterwave-provider-validation.test.ts tests/gateway-routing-and-custom-tools.test.ts

      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
