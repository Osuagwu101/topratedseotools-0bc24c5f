name: One-time writer auth reset debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-writer-auth-reset-debug.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe one-time reset endpoint
        shell: bash
        run: |
          set +x
          ENDPOINT='https://id-preview--4f4632d6-30e9-428a-b31e-ec81b5b680a6.lovable.app/api/diag/writer-auth-reset-e2e-820b5d66d7e8ca6d74a3fbc5fb108060'
          TOKEN='tUJksumQ5_QNS8OsHGGTRT4wu8T5bUZQz5c5l_4BE3PxzHcwz3fpzszIP7Ljzztm'
          KEY='mFCDNY4psDqVmpYyG2wnFMknz9BJDw-56pUEs36zANw'
          STATUS=$(curl --silent --show-error --get \
            --data-urlencode "token=$TOKEN" \
            --data-urlencode "key=$KEY" \
            -o /tmp/body.txt -w "%{http_code}" "$ENDPOINT" || true)
          unset TOKEN KEY ENDPOINT
          echo "HTTP_STATUS=$STATUS"
          python3 - <<'PY'
          import json
          p='/tmp/body.txt'
          try:
              raw=open(p).read()
          except Exception:
              raw=''
          try:
              d=json.loads(raw)
              print(json.dumps(d, separators=(',',':')))
          except Exception:
              print(raw[:500])
          PY
