name: One-time writer frontend E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-writer-frontend-e2e.yml"

permissions:
  contents: read
  id-token: write

jobs:
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare browser harness
        shell: bash
        run: |
          set +x
          mkdir -p /tmp/writer-e2e
          cd /tmp/writer-e2e
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core@24.16.0
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No Chrome/Chromium found on runner"
            exit 1
          fi

      - name: Retrieve one-time credential through GitHub OIDC
        shell: bash
        run: |
          set +x
          OIDC_JSON=$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=topratedseotools-writer-e2e")
          OIDC=$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          unset OIDC_JSON

          ENDPOINT='https://topratedseotools.lovable.app/api/diag/writer-frontend-credential-e2e-7d22f63e9ad14784b661d67e4e0d5b8f'
          CREDS=''
          STATUS=''
          for i in $(seq 1 18); do
            STATUS=$(curl --silent --show-error               -H "Authorization: Bearer $OIDC"               -H "Accept: application/json"               -o /tmp/writer-creds.json -w "%{http_code}" "$ENDPOINT" || true)
            if [ "$STATUS" = "200" ]; then
              break
            fi
            sleep 10
          done
          unset OIDC ENDPOINT
          if [ "$STATUS" != "200" ]; then
            echo "Credential bridge did not become ready; HTTP $STATUS"
            exit 1
          fi

          PW=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/writer-creds.json'))
          p=d.get('password')
          w=d.get('writers')
          if not isinstance(p,str) or len(p)<8 or not isinstance(w,list) or len(w)!=3:
              raise SystemExit(1)
          print(p)
          PY
          )
          echo "::add-mask::$PW"
          printf '%s' "$PW" > /tmp/writer-password.txt
          chmod 600 /tmp/writer-password.txt
          rm -f /tmp/writer-creds.json
          echo "Credential retrieved securely for 3-writer E2E."

      - name: Login all writers and launch Phrasly concurrently
        shell: bash
        env:
          NODE_PATH: /tmp/writer-e2e/node_modules
        run: |
          set +x
          node <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const base = 'https://topratedseotools.lovable.app';
          const password = fs.readFileSync('/tmp/writer-password.txt', 'utf8');
          const writers = [
            'viralliam3@gmail.com',
            'smartmove1914@gmail.com',
            'umarsuraka@gmail.com',
          ];

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.CHROME_BIN,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu'],
            });

            const sessions = [];
            try {
              for (const email of writers) {
                const context = await browser.createBrowserContext();
                const page = await context.newPage();
                await page.setViewport({ width: 1365, height: 900 });

                await page.goto(base + '/login', {
                  waitUntil: 'networkidle2',
                  timeout: 60000,
                });

                await page.waitForSelector('input[type="email"]', { timeout: 20000 });
                await page.type('input[type="email"]', email, { delay: 10 });
                await page.type('input[type="password"]', password, { delay: 10 });
                await page.click('button[type="submit"]');

                await page.waitForFunction(
                  () => location.pathname === '/dashboard' || location.pathname === '/change-password',
                  { timeout: 30000 },
                );

                const loginPath = await page.evaluate(() => location.pathname);
                if (loginPath !== '/dashboard') {
                  throw new Error(email + ': login did not reach dashboard; path=' + loginPath);
                }

                await page.goto(base + '/tools/phrasly', {
                  waitUntil: 'networkidle2',
                  timeout: 60000,
                });

                try {
                  await page.waitForFunction(
                    () => document.body.innerText.includes('You have access'),
                    { timeout: 30000 },
                  );
                } catch {
                  const accessState = await page.evaluate(() => {
                    const t = document.body.innerText;
                    if (t.includes('You have access')) return 'granted';
                    if (t.includes('Subscribe to unlock')) return 'paywall';
                    if (t.includes('Sign in to launch')) return 'sign_in_required';
                    if (t.includes('Currently unavailable')) return 'disabled';
                    return 'unknown';
                  });
                  throw new Error(email + ': Phrasly frontend access did not resolve to granted; final state=' + accessState);
                }

                sessions.push({ email, context, page });
                console.log(email + ' login=true access=true');
              }

              async function launchOne(session) {
                const { email, context, page } = session;
                const button = await page.evaluateHandle(() => {
                  return [...document.querySelectorAll('button')]
                    .find((b) => (b.textContent || '').includes('Launch Phrasly')) || null;
                });
                const element = button.asElement();
                if (!element) throw new Error(email + ': Launch Phrasly button not found');

                const beforePages = new Set(await context.pages());
                await element.click();

                const deadline = Date.now() + 120000;
                let handoff = false;
                let externalHost = '';

                while (Date.now() < deadline) {
                  const pages = await context.pages();

                  for (const candidate of pages) {
                    const url = candidate.url();
                    if (!/^https:\/\//.test(url)) continue;

                    let host = '';
                    try { host = new URL(url).host; } catch {}
                    if (!host || host === new URL(base).host) continue;

                    if (candidate !== page || !beforePages.has(candidate) || page.url() === url) {
                      handoff = candidate !== page;
                      externalHost = host;
                      break;
                    }
                  }

                  if (externalHost) break;

                  const state = await page.evaluate(() => {
                    const t = document.body.innerText;
                    if (t.includes('temporarily unavailable')) return 'reauth_required';
                    if (t.includes('One-Click Login failed')) return 'failed';
                    if (t.includes('secure login service returned an invalid')) return 'invalid_url';
                    return 'waiting';
                  }).catch(() => 'waiting');

                  if (state !== 'waiting') {
                    throw new Error(email + ': Phrasly launch result=' + state);
                  }

                  await sleep(500);
                }

                if (!externalHost) {
                  throw new Error(email + ': no durable Phrasly browser handoff observed within 120s');
                }

                console.log(email + ' phrasly_launch=true handoff=' + handoff + ' external_host=' + externalHost);
                return { email, result: 'launched', handoff };
              }

              const results = await Promise.all(sessions.map(launchOne));
              if (results.length !== 3 || results.some((r) => r.result !== 'launched')) {
                throw new Error('Not all writer launches succeeded');
              }

              console.log('FRONTEND_E2E_SUCCESS=3/3');
            } finally {
              for (const s of sessions) {
                try { await s.context.close(); } catch {}
              }
              await browser.close();
              try { fs.unlinkSync('/tmp/writer-password.txt'); } catch {}
            }
          })().catch((err) => {
            console.error('FRONTEND_E2E_FAILURE:', err.message);
            process.exit(1);
          });
          NODE
