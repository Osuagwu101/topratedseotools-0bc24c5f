name: Custom Payment Runtime E2E Audit

on:
  push:
    branches: [runtime-audit-custom-payments]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright runtime
        run: |
          mkdir -p /tmp/custom-payment-audit
          cd /tmp/custom-payment-audit
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cp "$GITHUB_WORKSPACE/.github/scripts/custom-payment-runtime-e2e.mjs" ./audit.mjs
      - name: Run live Custom Payment handoff audit
        working-directory: /tmp/custom-payment-audit
        run: node audit.mjs
