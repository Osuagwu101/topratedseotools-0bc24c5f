name: Phrasly Auth Audit

on:
  push:
    branches:
      - audit/phrasly-shared-auth-20260902

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/phrasly-shared-auth-20260902
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch OTP resume to use Browser Use page session
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/browser-auth-otp.functions.ts')
          s=p.read_text()
          s=s.replace(
            'import {\n  CdpClient,\n  reconnectBrowserUseSession,\n  reconnectCloudflareSession,\n} from "@/lib/browser-auth.server";',
            'import {\n  CdpClient,\n  reconnectBrowserUseSession,\n  reconnectCloudflareSession,\n} from "@/lib/browser-auth.server";\nimport { attachBrowserUsePage, waitForAuthenticatedPage } from "@/lib/browser-auth-session.server";'
          )
          needle='''      // Submit OTP code\n      let submitResult: any;'''
          replacement='''      // Browser Use reconnects at browser scope; reattach to the actual page target\n      // before evaluating OTP/auth/storage expressions. Cloudflare reconnects directly\n      // to the page target and therefore does not need a CDP session id.\n      const pageSessionId =\n        sess.provider === "browser_use" ? await attachBrowserUsePage(cdp) : undefined;\n\n      // Submit OTP code\n      let submitResult: any;'''
          if needle not in s: raise SystemExit('OTP submit insertion point not found')
          s=s.replace(needle,replacement)
          s=s.replace('''        submitResult = await cdp.send("Runtime.evaluate", {\n          expression: submitOtpExpression(data.otp_code, otpCtx.field_selector),\n          returnByValue: true,\n          awaitPromise: true,\n        });''','''        submitResult = await cdp.send(\n          "Runtime.evaluate",\n          {\n            expression: submitOtpExpression(data.otp_code, otpCtx.field_selector),\n            returnByValue: true,\n            awaitPromise: true,\n          },\n          pageSessionId,\n        );''')
          old='''      // Wait for login to complete (2 seconds, then check auth status)\n      await new Promise((resolve) => setTimeout(resolve, 2000));\n\n      // Verify login succeeded\n      const authCheck = await cdp?.send("Runtime.evaluate", {\n        expression: checkAuthenticationStatusExpression(),\n        returnByValue: true,\n        awaitPromise: true,\n      });\n\n      const authStatus = authCheck?.result?.value as any;\n      if (!authStatus?.authenticated) {\n        throw new RetryableOtpError("OTP was not accepted or login verification did not complete.");\n      }\n\n      // Capture authenticated session state\n      const sessionState = await captureSessionStateThroughCdp(cdp);'''
          new='''      // Phrasly redirects asynchronously after OTP. Poll instead of relying on a\n      // brittle fixed delay so a valid OTP is not rejected during navigation.\n      const authStatus = await waitForAuthenticatedPage(cdp, pageSessionId, 15_000);\n      if (!authStatus.authenticated) {\n        throw new RetryableOtpError("OTP was not accepted or login verification did not complete.");\n      }\n\n      // Capture cookies plus local/session storage from the authenticated page.\n      const sessionState = await captureSessionStateThroughCdp(cdp, pageSessionId);\n      if (!sessionState.authenticated_cookies.length) {\n        throw new RetryableOtpError("Login succeeded but no reusable Phrasly session cookies were captured.");\n      }'''
          if old not in s: raise SystemExit('Old fixed-delay auth verification block not found')
          s=s.replace(old,new)
          # no longer directly used after replacing the auth check
          s=s.replace('''  submitOtpExpression,\n  checkAuthenticationStatusExpression,\n  captureSessionStateThroughCdp,''','''  submitOtpExpression,\n  captureSessionStateThroughCdp,''')
          # Preserve the account id in successful audit events.
          s=s.replace('''        account_id: null,\n        event: "otp_accepted",''','''        account_id: accountId ?? null,\n        event: "otp_accepted",''')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Commit OTP patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/browser-auth-otp.functions.ts
          if git diff --cached --quiet; then
            echo "No generated patch to commit"
          else
            git commit -m "Fix Phrasly OTP resume and session capture"
            git push origin HEAD:audit/phrasly-shared-auth-20260902
          fi
