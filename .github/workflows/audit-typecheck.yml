name: Audit Typecheck

on:
  push:
    branches: [audit/typecheck-20260902]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          bunx tsc --noEmit 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          bun run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs
          path: |
            typecheck.log
            lint.log
            build.log
          if-no-files-found: error
      - name: Fail if audit failed
        if: always()
        shell: bash
        run: |
          echo "typecheck=${{ steps.typecheck.outputs.exit_code }}"
          echo "lint=${{ steps.lint.outputs.exit_code }}"
          echo "build=${{ steps.build.outputs.exit_code }}"
          test "${{ steps.typecheck.outputs.exit_code }}" = "0" \
            -a "${{ steps.lint.outputs.exit_code }}" = "0" \
            -a "${{ steps.build.outputs.exit_code }}" = "0"
