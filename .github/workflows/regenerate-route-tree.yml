name: Regenerate TanStack Route Tree

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'Regenerate TanStack route tree'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate routes via production build
        run: npm run build
      - name: Commit regenerated route tree
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "Regenerate TanStack route tree"
          git push
