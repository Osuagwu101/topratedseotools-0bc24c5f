name: Phase 4 StealthWriter Validation

on:
  push:
    branches: [phase4-stealthwriter-validation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Phase 2 admin-session vault
        run: bun tests/stealthwriter-session-vault.test.ts
      - name: Phase 3 proxy regressions
        run: bun tests/stealthwriter-proxy.test.ts
      - name: Phase 4 AWS/video validation matrix
        run: bun tests/stealthwriter-phase4-validation.test.ts
      - name: Phase 4 source-conformance audit
        run: bun tests/stealthwriter-phase4-source-conformance.test.ts

      - name: SneakWrite regression
        run: bun tests/direct-sso-url.test.ts
      - name: Phrasly regression
        run: bun tests/phrasly-auth-state.test.ts
      - name: Custom payment regressions
        run: bunx vitest run tests/custom-payment-merchant-currencies.test.ts tests/custom-payment-gateways.test.ts tests/flutterwave-gateway.test.ts tests/flutterwave-provider-validation.test.ts tests/gateway-routing-and-custom-tools.test.ts

      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
