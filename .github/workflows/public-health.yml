name: Public Login & Asset Health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-customer-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check public customer and admin entry assets
        run: python3 scripts/check_public_asset_health.py https://topratedseotools.com
