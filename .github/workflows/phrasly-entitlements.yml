name: Phrasly entitlement regression
on:
  push:
    paths:
      - "supabase/migrations/*phrasly_entitlement_feature_sync.sql"
      - "tests/phrasly-entitlements/**"
      - ".github/workflows/phrasly-entitlements.yml"
  pull_request:
    paths:
      - "supabase/migrations/*phrasly_entitlement_feature_sync.sql"
      - "tests/phrasly-entitlements/**"
      - ".github/workflows/phrasly-entitlements.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entitlement-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/phrasly-entitlements/package-lock.json
      - run: npm ci --prefix tests/phrasly-entitlements --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix tests/phrasly-entitlements
