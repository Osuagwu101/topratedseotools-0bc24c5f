name: Phrasly Phase 3 isolated database
on:
  push:
    branches:
      - phrasly/phase3-backend-20261026
  pull_request:
    paths:
      - 'supabase/migrations/2026102608*'
      - 'tests/phrasly-phase3-schema.sql'
      - '.github/workflows/phrasly-phase3-backend.yml'
jobs:
  postgres-fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase 3 migrations in disposable PostgreSQL
        env:
          PGPASSWORD: fixture-only
        run: psql -h localhost -U postgres -d fixture -X -v ON_ERROR_STOP=1 -f tests/phrasly-phase3-schema.sql

  endpoint-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test AWS-compatible handlers with synthetic login and provider state
        run: bun test tests/phrasly-phase3-backend.test.ts

  http-staging-smoke:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_staging_dummy
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_staging_dummy
      VITE_SUPABASE_URL: http://127.0.0.1:9
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_staging_dummy
      VITE_SUPABASE_PROJECT_ID: isolated-stage
      PHRASLY_EXTENSION_ENABLED: 'false'
      PORT: '3327'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build offline application in disposable staging
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Start actual compiled Nitro server and verify Phrasly routes fail closed
        run: |
          node .output/server/index.mjs > /tmp/phrasly-phase3-stage.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:3327/" -o /dev/null; then break; fi
            sleep 1
          done
          for path in '/ext-handoff.php?tool_id=phrasly&feature=humanizer' '/ext-fulfill.php?payload=invalid&signature=invalid' '/ext-whoami.php'; do
            status=$(curl -sS -o /tmp/response.json -w '%{http_code}' "http://127.0.0.1:3327$path")
            test "$status" = 503
            grep -q 'service_unavailable' /tmp/response.json
          done
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' -X POST -d 'record_token=invalid&feature=humanizer' "http://127.0.0.1:3327/ext-check-usage.php")
          test "$status" = 503
          grep -q 'service_unavailable' /tmp/response.json
          echo "PHRASLY_PHASE3_STAGING_HTTP_PASS"
      - name: Verify enabled routes reject requests without valid access
        env:
          PHRASLY_EXTENSION_ENABLED: 'true'
          PHRASLY_AWS_EXTENSION_GATE_SECRET: 'phase3-fixture-secret-not-for-production-123456'
          PORT: '3328'
        run: |
          node .output/server/index.mjs > /tmp/phrasly-phase3-enabled.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:3328/" -o /dev/null; then break; fi
            sleep 1
          done
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' "http://127.0.0.1:3328/ext-handoff.php?tool_id=phrasly&feature=humanizer")
          test "$status" = 401
          grep -q 'not_signed_in' /tmp/response.json
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' "http://127.0.0.1:3328/ext-fulfill.php")
          test "$status" = 400
          grep -q 'missing_token' /tmp/response.json
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' "http://127.0.0.1:3328/ext-whoami.php")
          test "$status" = 200
          grep -q 'not_signed_in' /tmp/response.json
          echo "PHRASLY_PHASE3_ENABLED_ROUTE_GUARDS_PASS"

  real-local-auth-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install local Supabase CLI and application dependencies
        run: |
          bun install --frozen-lockfile
          bun add --no-save supabase@latest
      - name: Start disposable Supabase Auth, PostgREST and PostgreSQL
        run: |
          mkdir -p /tmp/phrasly-phase3-supabase
          cd /tmp/phrasly-phase3-supabase
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" init --yes
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Configure actual local backend and run migrations
        run: |
          cd /tmp/phrasly-phase3-supabase
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" status -o env > "$GITHUB_WORKSPACE/.phase3-local-env"
          cd "$GITHUB_WORKSPACE"
          set -a
          source .phase3-local-env
          set +a
          export PGPASSWORD=postgres
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f tests/phrasly-phase3-local-auth-schema.sql
          for sql in supabase/migrations/20261026080000_phrasly_aws_oneclick_phase3.sql supabase/migrations/20261026080100_phrasly_aws_oneclick_allocator.sql supabase/migrations/20261026080200_phrasly_aws_tool_config.sql; do
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$sql"
          done
      - name: Build and start Nitro using real local Supabase
        run: |
          set -a
          source .phase3-local-env
          set +a
          export SUPABASE_URL="$API_URL"
          export SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export VITE_SUPABASE_PROJECT_ID=local-phase3
          export PHRASLY_EXTENSION_ENABLED=true
          export PHRASLY_AWS_EXTENSION_GATE_SECRET='phase3-fixture-secret-for-real-local-auth-123456'
          export PORT=3329
          bun run build
          node .output/server/index.mjs > /tmp/phase3-real-auth-nitro.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3329/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node tests/phrasly-phase3-live-auth.mjs
