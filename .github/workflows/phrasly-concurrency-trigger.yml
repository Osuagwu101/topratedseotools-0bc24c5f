name: Phrasly Concurrency Trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phrasly-concurrency-trigger.yml'

permissions:
  contents: read

jobs:
  run-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger one-shot production diagnostic
        shell: bash
        run: |
          set -u
          curl -sS --max-time 180 \
            -w '\nHTTP_STATUS:%{http_code}\n' \
            'https://topratedseotools.lovable.app/api/diag/phrasly-concurrency-e2e-c7a1f3a87d9e4e54b8bd2a7317e63521'
