<!DOCTYPE html>
<html>
<head>
    <title>Jawad Ahmed EXR</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 15px;
        min-width: 350px;
        background-color: #f4f7f6;
        color: #333;
      }
      h2 {
        color: #007bff;
        text-align: center;
        border-bottom: 2px solid #007bff;
        padding-bottom: 10px;
        margin-top: 0;
      }
      .developer-info {
        text-align: center;
        color: #6c757d;
        font-size: 0.9em;
        margin-top: -10px;
        margin-bottom: 15px;
      }
      #cookie-container {
        max-height: 250px;
        overflow-y: auto;
        border: 1px solid #ddd;
        padding: 10px;
        background-color: #fff;
        border-radius: 5px;
        margin-bottom: 15px;
      }
      ul {
        list-style-type: none;
        padding: 0;
      }
      li {
        background-color: #e9ecef;
        margin-bottom: 8px;
        padding: 10px;
        border-radius: 4px;
        word-wrap: break-word;
      }
      .cookie-name {
        font-weight: bold;
        color: #555;
      }
      .copy-btn {
        display: block;
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      .copy-btn:hover {
        background-color: #218838;
      }
      #status-message {
        text-align: center;
        color: #6c757d;
        margin-top: 10px;
      }
    </style>
</head>
<body>
    <h2>Jawad Ahmed EXR</h2>
    <div class="developer-info">Developed By - Jawad Ahmed &middot; jawadpushia.com</div>
    <div id="cookie-container">
        <ul id="cookie-list"></ul>
    </div>
    <button id="copy-json-btn" class="copy-btn">Copy Cookies as JSON</button>
    <div id="status-message"></div>
    <script src="popup.js"></script>
</body>
</html>
