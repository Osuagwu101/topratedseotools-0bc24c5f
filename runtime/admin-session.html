<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuillBot authorised session — Admin</title><style>body{background:#0f172a;color:#e2e8f0;font:16px/1.5 system-ui;margin:0;display:grid;place-items:center;min-height:100vh}main{max-width:460px;width:calc(100% - 64px);padding:30px;background:#1e293b;border:1px solid #334155;border-radius:20px}h1{font-size:24px;color:#60a5fa}label{display:block;margin-top:12px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;margin:8px 0;border-radius:8px;border:1px solid #475569}button{background:#2563eb;color:white;cursor:pointer;font-weight:700}#status{color:#fbbf24;min-height:24px}small{color:#94a3b8}</style></head><body><main><h1>QuillBot authorised session</h1><p>Sign in as Admin and select a fresh QuillBot session export from your authorised Premium browser.</p><form id="refresh"><label>Admin email<input name="email" type="email" autocomplete="username" required></label><label>Admin password<input name="password" type="password" autocomplete="current-password" required></label><label>QuillBot session JSON<input name="session" type="file" accept=".json,application/json" required></label><button>Save encrypted session</button></form><p id="status" role="status"></p><small>The file must contain only <code>cookie</code> and <code>useridtoken</code>. It is encrypted on the server. Nothing is returned to writers.</small></main><script>document.getElementById('refresh').addEventListener('submit',async event=>{event.preventDefault();const form=event.target;const button=form.querySelector('button');const status=document.getElementById('status');button.disabled=true;try{const file=form.elements.session.files[0];if(!file||file.size>65000)throw new Error('Select a session JSON file smaller than 65 KB.');const payload=await file.text();const obj=JSON.parse(payload);if(Object.keys(obj).length!==2||typeof obj.cookie!=='string'||typeof obj.useridtoken!=='string')throw new Error('The file must contain cookie and useridtoken only.');status.textContent='Verifying Admin…';const login=await fetch('/__qbtest/__trst/app-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:form.elements.email.value,password:form.elements.password.value})});form.elements.password.value='';if(!login.ok)throw new Error(await login.text());const auth=await login.json();status.textContent='Encrypting session…';const save=await fetch('/__qbtest/__trst/admin/session',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+auth.access_token},body:payload});if(!save.ok)throw new Error(await save.text());form.reset();status.textContent='Encrypted session saved. Account acceptance and native dashboard access still require live verification.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
