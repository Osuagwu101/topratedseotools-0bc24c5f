<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Rated SEO Tools — QuillBot test</title><style>body{background:#0f172a;color:#e2e8f0;font:16px/1.5 system-ui;margin:0;display:grid;place-items:center;min-height:100vh}main{max-width:420px;width:calc(100% - 64px);padding:30px;border:1px solid #334155;border-radius:20px;background:#1e293b}h1{font-size:25px;color:#60a5fa}input,button{box-sizing:border-box;width:100%;font:inherit;border-radius:9px;padding:12px;margin:8px 0;border:1px solid #475569}button{background:#2563eb;color:white;cursor:pointer;font-weight:700}#status{min-height:24px;color:#fbbf24}small{color:#94a3b8}label{display:block}</style></head><body><main><h1>QuillBot Plagiarism Checker</h1><p>Sign in with your Top Rated SEO Tools account to open the official QuillBot plagiarism checker.</p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Open Plagiarism Checker</button></form><p id="status" role="status"></p><small>QuillBot opens on its official website. Sign in with your own QuillBot account there; QuillBot manages the monthly word allowance.</small></main><script>document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const form=event.target;const status=document.getElementById('status');const button=form.querySelector('button');button.disabled=true;status.textContent='Signing in…';try{const values=new FormData(form);const login=await fetch('/__qbtest/__trst/app-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:values.get('email'),password:values.get('password')})});form.elements.password.value='';if(!login.ok)throw new Error(await login.text());const session=await login.json();status.textContent='Checking access…';const launch=await fetch('/__qbtest/__trst/launch',{method:'POST',headers:{authorization:'Bearer '+session.access_token}});if(!launch.ok)throw new Error(await launch.text());const data=await launch.json();location.assign(data.launch_url);}catch(error){status.textContent=error.message;button.disabled=false;}});</script></body></html>
