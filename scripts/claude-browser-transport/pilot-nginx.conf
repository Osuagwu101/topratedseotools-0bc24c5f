server {
    listen 4173 ssl;
    server_name claude.topratedseotools.com;
    ssl_certificate /etc/letsencrypt/live/claude.topratedseotools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claude.topratedseotools.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3273;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
